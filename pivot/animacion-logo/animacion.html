:root{--bg:#F5F0E8;--ink:#1A1A1A;--muted:#6B655F;--line:#E2DACD;--chip:#FFFFFF;--red:#E63915}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121010;--ink:#F5F0E8;--muted:#A49D95;--line:#2C2725;--chip:#1D1A19}}
:root[data-theme="dark"]{--bg:#121010;--ink:#F5F0E8;--muted:#A49D95;--line:#2C2725;--chip:#1D1A19}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:28px 16px 48px;display:grid;gap:20px}
h1{font-size:clamp(24px,4vw,34px);line-height:1.05;margin:0;letter-spacing:-.02em}
.sub{margin:6px 0 0;color:var(--muted);font-size:15px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:600 14px 'DM Sans',sans-serif;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer}
button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.stage{display:grid;place-items:center}

const LOGO_W=1114, LOGO_H=264;
const LETTERS=[[0,239],[245,369],[375,636],[642,918],[924,1114]];
const TAU=Math.PI*2, FPS=30;
const INTRO=1.4, D=2.4, OUTRO=2.4, TR=0.32;

/* ---------- utilidades ---------- */
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo3=t=>1-Math.pow(1-t,3);
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eob=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const eoe=t=>t>=1?1:1-Math.pow(2,-10*t);
const elastic=t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(TAU/3))+1;
function hash(a,b=0){let h=Math.imul(a|0,73856093)^Math.imul(b|0,19349663)^0x5bd1e995;h=Math.imul(h^(h>>>15),0x2c1b3c6d);h=Math.imul(h^(h>>>12),0x297a2d39);h^=h>>>15;return (h>>>0)/4294967296}
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c}
function cx2(c){return c.getContext('2d')}
const pad2=n=>String(n).padStart(2,'0');

let LOGO=null;

function makeS(W,H,fmt){
  const u=W/1080, lw=Math.round(W*.74), lh=Math.round(lw*LOGO_H/LOGO_W);
  const cx=W/2, cy=fmt==='story'?H*.46:H*.47;
  const M=mk(lw,lh), x=cx2(M); x.imageSmoothingQuality='high'; x.drawImage(LOGO,0,0,lw,lh);
  const letters=LETTERS.map(([a,b])=>({x0:Math.floor(a*lw/LOGO_W),x1:Math.ceil(b*lw/LOGO_W)}));
  return {W,H,u,lw,lh,cx,cy,lx:cx-lw/2,ly:cy-lh/2,fmt,M,letters,
    labelY:fmt==='story'?H*.86:H-104*u,tall:fmt==='story'?1.25:1,cache:new Map(),scr:new Map()};
}
function cached(S,key,fn){if(!S.cache.has(key))S.cache.set(key,fn());return S.cache.get(key)}
function scr(S,name,w,h){
  let c=S.scr.get(name);w=Math.ceil(w);h=Math.ceil(h);
  if(!c||c.width!==w||c.height!==h){c=mk(w,h);S.scr.set(name,c)}
  const x=cx2(c);x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.globalCompositeOperation='source-over';x.filter='none';x.shadowBlur=0;x.shadowColor='transparent';x.clearRect(0,0,w,h);
  return c;
}
function tintOf(src,color){const c=mk(src.width,src.height),x=cx2(c);x.drawImage(src,0,0);x.globalCompositeOperation='source-in';x.fillStyle=color;x.fillRect(0,0,c.width,c.height);return c}
function tint(S,color){return cached(S,'t'+color,()=>tintOf(S.M,color))}
function padded(src,p){const c=mk(src.width+2*p,src.height+2*p);cx2(c).drawImage(src,p,p);return c}
function grow(src,r,color){ // dilata una máscara (ya con margen) r píxeles
  const t=tintOf(src,color),c=mk(src.width,src.height),x=cx2(c);
  for(const rr of [r,r*.66,r*.33])for(let i=0;i<32;i++){const a=i/32*TAU;x.drawImage(t,Math.cos(a)*rr,Math.sin(a)*rr)}
  x.drawImage(t,0,0);return c;
}
function dilate(S,r,color){return cached(S,'d'+r+color,()=>{const p=Math.ceil(r)+2;return {c:grow(padded(S.M,p),r,color),pad:p}})}
function outline(S,r,color){return cached(S,'o'+r+color,()=>{const d=dilate(S,r,color),x=cx2(d.c);x.globalCompositeOperation='destination-out';x.drawImage(S.M,d.pad,d.pad);return d})}
function fillWith(S,name,fn){const c=scr(S,name,S.lw,S.lh),x=cx2(c);fn(x,S.lw,S.lh);x.globalCompositeOperation='destination-in';x.drawImage(S.M,0,0);x.globalCompositeOperation='source-over';return c}
function staticFill(S,key,fn){return cached(S,key,()=>{const c=mk(S.lw,S.lh),x=cx2(c);fn(x,S.lw,S.lh);x.globalCompositeOperation='destination-in';x.drawImage(S.M,0,0);return c})}
function innerLight(S,face,color,ox,oy,blur){ // bisel interior
  const c=mk(S.lw,S.lh),x=cx2(c);x.fillStyle=color;x.fillRect(0,0,S.lw,S.lh);
  x.globalCompositeOperation='destination-out';x.filter=`blur(${blur}px)`;x.drawImage(S.M,ox,oy);x.filter='none';
  x.globalCompositeOperation='destination-in';x.drawImage(S.M,0,0);
  cx2(face).drawImage(c,0,0);
}
function atLogo(g,S,sx,sy,ox,oy,ay,fn){g.save();g.translate(S.cx+ox,S.ly+S.lh*ay+oy);g.scale(sx,sy);g.translate(-S.lw/2,-S.lh*ay);fn();g.restore()}
function drawLetter(g,S,src,i,x,y,s){const L=S.letters[i],w=L.x1-L.x0;g.save();g.translate(x,y);g.scale(s,s);g.drawImage(src,L.x0,0,w,S.lh,-w/2,-S.lh,w,S.lh);g.restore()}

function label(g,S,left,right,ticks,color){
  const {W,u}=S,m=80*u,fs=Math.round(26*u);
  g.save();g.font=`700 ${fs}px "Space Mono", monospace`;g.fillStyle=color;g.textBaseline='alphabetic';
  g.textAlign='left';g.fillText(left,m,S.labelY);g.textAlign='right';g.fillText(right,W-m,S.labelY);
  const n=11,gap=6*u,tw=(W-2*m-gap*(n-1))/n,y=S.labelY+22*u;
  for(let i=0;i<n;i++){g.globalAlpha=i<ticks?1:.25;g.fillRect(m+i*(tw+gap),y,tw,5*u)}
  g.restore();
}

/* ---------- 00 · original ---------- */
function intro(g,t,S){
  const {W,H,u,lw,lh}=S;
  g.fillStyle='#F5F0E8';g.fillRect(0,0,W,H);
  const r=eo3(cl((t-.1)/.7));
  g.save();g.beginPath();g.rect(0,S.ly+lh*(1-r)-2,W,lh*r+4);g.clip();
  g.drawImage(tint(S,'#E63915'),S.lx,S.ly+(1-r)*lh*.35);g.restore();
}

/* ---------- 01 · swiss ---------- */
function swiss(g,t,S){
  const {W,H,u,lw,lh,cy}=S;
  g.fillStyle='#EEEBE5';g.fillRect(0,0,W,H);
  const m=80*u,cols=6,cw=(W-2*m)/cols,e=eo3(cl(t/.6));
  g.strokeStyle='rgba(26,26,26,.13)';g.lineWidth=1.5*u;
  for(let i=0;i<=cols;i++){const x=m+i*cw;g.beginPath();g.moveTo(x,0);g.lineTo(x,H*e);g.stroke()}
  const rows=S.fmt==='story'?12:9;
  for(let j=1;j<rows;j++){const y=H*j/rows;g.beginPath();g.moveTo(W,y);g.lineTo(W-W*e,y);g.stroke()}
  const ce=eob(cl((t-.1)/.6)),R=W*.3*ce;
  g.fillStyle='#E63915';g.beginPath();g.arc(m+cw*4.3+Math.sin(t*1.3)*8*u,cy-lh*1.25*S.tall,R,0,TAU);g.fill();
  const be=eoe(cl((t-.35)/.6));g.fillStyle='#1A1A1A';g.fillRect(0,cy+lh/2+44*u,(m+cw*3)*be,14*u);
  const le=eoe(cl((t-.12)/.7));g.drawImage(tint(S,'#1A1A1A'),lerp(-lw-20*u,m,le),cy-lh/2);
  g.font=`400 ${170*u}px "DM Sans"`;g.textBaseline='top';g.textAlign='left';g.globalAlpha=e;g.fillText('01',m-8*u,cy-lh*2.25*S.tall);
  const fs=24*u;g.font=`700 ${fs}px "DM Sans"`;
  [[0,['Pivot Agencia','Medellín, CO']],[3,['Estrategia','Contenido','Web']],[5,['2026']]].forEach(([c,lines],bi)=>{
    const a=eo3(cl((t-.5-bi*.1)/.4));g.globalAlpha=a;
    lines.forEach((s,li)=>g.fillText(s,m+c*cw+8*u+(1-a)*24*u,cy+lh/2+96*u+li*fs*1.3));
  });
  g.globalAlpha=1;
}

/* ---------- 02 · kinetic type ---------- */
function kinetic(g,t,S){
  const {W,H,u,lw,lh,cy}=S;
  g.fillStyle='#121010';g.fillRect(0,0,W,H);
  const sc=.5,oc=outline(S,4*u,'#F5F0E8'),orr=outline(S,4*u,'#E63915');
  const ow=lw*sc,per=ow+40*u,rowH=lh*sc+30*u,ap=eo3(cl(t/.5));
  const N=Math.ceil(H/2/rowH)+1;
  for(let k=-N;k<=N;k++){
    if(Math.abs(k)<=1)continue;
    const y=cy+k*rowH,dir=k%2?1:-1,sp=(170+Math.abs(k)*25)*u;
    const off=((t*sp*dir)%per+per)%per,red=Math.abs(k)===2,o=red?orr:oc;
    g.globalAlpha=ap*(red?.95:.17);
    for(let x=-per+off-per*(k&1?.5:0);x<W+per;x+=per)g.drawImage(o.c,x-o.pad*sc,y-lh*sc/2-o.pad*sc,o.c.width*sc,o.c.height*sc);
  }
  g.globalAlpha=1;
  const src=tint(S,'#E63915');
  for(let j=0;j<5;j++){
    const L=S.letters[j],tj=t-.07*j,s=elastic(cl(tj/.85));
    const hop=t>.95?Math.max(0,Math.sin((t-.95)*7-j*.8))*lh*.24*cl((t-.95)/.3):0;
    if(s>0)drawLetter(g,S,src,j,S.lx+(L.x0+L.x1)/2,S.ly+lh-hop,s);
  }
}

/* ---------- 03 · pop art ---------- */
function popBg(S){return cached(S,'popbg',()=>{
  const {W,H,u,cx,cy}=S,c=mk(W,H),x=cx2(c);x.fillStyle='#FFD23F';x.fillRect(0,0,W,H);
  x.fillStyle='#FF5DA2';const sp=30*u,md=Math.hypot(W,H)/2;
  for(let r=0,y=0;y<H+sp;y+=sp*.87,r++)for(let xx=(r%2)*sp/2;xx<W+sp;xx+=sp){
    const d=Math.hypot(xx-cx,y-cy)/md,rad=sp*.46*cl((d-.18)/.7);if(rad>.5){x.beginPath();x.arc(xx,y,rad,0,TAU);x.fill()}}
  return c})}
function burst(g,x,y,R,r,n,rot,fill,stroke,lw){
  g.beginPath();for(let i=0;i<n*2;i++){const a=rot+i/(n*2)*TAU,rr=i%2?r:R;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}g.closePath();
  g.fillStyle=fill;g.fill();if(stroke){g.lineJoin='miter';g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}
}
function pop(g,t,S){
  const {W,H,u,cx,cy,lw,lh}=S;
  g.drawImage(popBg(S),0,0);
  const be=eob(cl(t/.45));
  if(be>0){burst(g,cx,cy,W*.66*be,W*.5*be,20,-t*.22,'#29B6F6','#1A1A1A',6*u);burst(g,cx,cy,W*.52*be,W*.38*be,18,t*.3,'#FFFFFF','#1A1A1A',7*u)}
  const k=t<.12?0:eob(cl((t-.12)/.42));
  const sh=t<.75?(1-t/.75):0,ox=(hash(Math.floor(t*30),1)-.5)*16*u*sh,oy=(hash(Math.floor(t*30),2)-.5)*16*u*sh;
  const face=staticFill(S,'popface',(x,w,h)=>{x.fillStyle='#E63915';x.fillRect(0,0,w,h);x.fillStyle='#FF8A65';const sp=13*S.u;
    for(let r=0,y=0;y<h;y+=sp*.87,r++)for(let xx=(r%2)*sp/2;xx<w;xx+=sp){const rad=sp*.42*cl(1-y/(h*.7));if(rad>.4){x.beginPath();x.arc(xx,y,rad,0,TAU);x.fill()}}});
  g.fillStyle='#FFD23F';g.fillRect(0,S.labelY-56*u,W,110*u);g.fillStyle='#1A1A1A';g.fillRect(0,S.labelY-56*u,W,6*u);
  if(k>0)atLogo(g,S,k,k,ox,oy,.5,()=>{const d=dilate(S,9*u,'#1A1A1A');g.drawImage(d.c,-d.pad+18*u,-d.pad+18*u);g.drawImage(d.c,-d.pad,-d.pad);g.drawImage(face,0,0)});
}

/* ---------- 04 · flat 2D ---------- */
const FLAT=[[.16,-.44,'circle','#E63915',.1,0],[.84,-.4,'tri','#1A1A1A',.09,.06],[.6,-.64,'ring','#2EC4B6',.05,.12],[.36,-.3,'zig','#2EC4B6',.15,.18],
  [.15,.4,'square','#FFD166',.085,.1],[.83,.42,'half','#FF9F87',.1,.16],[.55,.46,'dots','#1A1A1A',.1,.22],[.42,-.54,'plus','#E63915',.035,.26],[.9,-.08,'circle','#FFD166',.025,.3]];
function shape(g,type,color,s,u){
  g.fillStyle=color;g.strokeStyle=color;g.lineCap='round';g.lineJoin='round';
  if(type==='circle'){g.beginPath();g.arc(0,0,s,0,TAU);g.fill()}
  else if(type==='tri'){g.beginPath();g.moveTo(0,-s);g.lineTo(s*.95,s*.7);g.lineTo(-s*.95,s*.7);g.closePath();g.fill()}
  else if(type==='ring'){g.lineWidth=s*.38;g.beginPath();g.arc(0,0,s*.8,0,TAU);g.stroke()}
  else if(type==='zig'){g.lineWidth=12*u;g.beginPath();for(let i=0;i<=6;i++)g.lineTo(-s+i*s/3,i%2?-s*.18:s*.18);g.stroke()}
  else if(type==='square'){g.rotate(.3);g.beginPath();g.roundRect(-s,-s,2*s,2*s,s*.2);g.fill()}
  else if(type==='half'){g.beginPath();g.arc(0,s*.3,s,Math.PI,0);g.closePath();g.fill()}
  else if(type==='dots'){for(let i=0;i<3;i++)for(let j=0;j<3;j++){g.beginPath();g.arc((i-1)*s*.7,(j-1)*s*.7,s*.14,0,TAU);g.fill()}}
  else if(type==='plus'){g.lineWidth=s*.55;g.beginPath();g.moveTo(-s,0);g.lineTo(s,0);g.moveTo(0,-s);g.lineTo(0,s);g.stroke()}
}
function flat(g,t,S){
  const {W,H,u,cy,lw,lh}=S;

  piece([W*.6,cy+lh*1.3*S.tall,W*.3,lh*.7],.04,4,(w,h)=>{x.fillStyle='#FBEDE9';x.fillRect(0,0,w,h);x.fillStyle='rgba(230,57,21,.35)';for(let i=0;i<w;i+=18*u)x.fillRect(i,0,2*u,h)});
  return c})}
function collageLetter(S,i){return cached(S,'cl'+i,()=>{
  const {lh,u}=S,L=S.letters[i],w=L.x1-L.x0,p=Math.ceil(12*u),m=mk(w+2*p,lh+2*p);cx2(m).drawImage(S.M,L.x0,0,w,lh,p,0+p,w,lh);
  const f=mk(m.width,m.height),x=cx2(f),W2=f.width,H2=f.height;
  if(i===0){x.fillStyle='#E63915';x.fillRect(0,0,W2,H2)}
  else if(i===1){x.fillStyle='#2B59C3';x.fillRect(0,0,W2,H2);x.fillStyle='rgba(255,255,255,.18)';for(let k=0;k<H2;k+=9*u)x.fillRect(0,k,W2,2*u)}
  else if(i===2){x.fillStyle='#1A1A1A';x.fillRect(0,0,W2,H2);x.strokeStyle='rgba(255,255,255,.14)';x.lineWidth=5*u;for(let k=-H2;k<W2;k+=16*u){x.beginPath();x.moveTo(k,H2);x.lineTo(k+H2,0);x.stroke()}}
  else if(i===3){x.fillStyle='#E63915';x.fillRect(0,0,W2,H2);x.fillStyle='#FBEDE9';const sp=26*u;for(let yy=0;yy<H2;yy+=sp)for(let xx=(yy/sp%2)*sp/2;xx<W2;xx+=sp){x.beginPath();x.arc(xx,yy,5.5*u,0,TAU);x.fill()}}
  else {x.fillStyle='#FFB199';x.fillRect(0,0,W2,H2);x.strokeStyle='rgba(230,57,21,.45)';x.lineWidth=1.5*u;for(let k=0;k<W2;k+=14*u){x.beginPath();x.moveTo(k,0);x.lineTo(k,H2);x.stroke()}for(let k=0;k<H2;k+=14*u){x.beginPath();x.moveTo(0,k);x.lineTo(W2,k);x.stroke()}}
  x.globalCompositeOperation='destination-in';x.drawImage(m,0,0);
  const c=grow(m,7*u,'#FFFDF6');cx2(c).drawImage(f,0,0);return c})}
function tape(g,x,y,w,h,rot,u){g.save();g.translate(x,y);g.rotate(rot);g.fillStyle='rgba(250,240,205,.78)';g.beginPath();
  for(let i=0;i<=6;i++)g.lineTo(-w/2+(i%2)*3*u,-h/2+i*h/6);for(let i=0;i<=6;i++)g.lineTo(w/2-(i%2)*3*u,h/2-i*h/6);g.closePath();g.fill();g.restore()}
const CROT=[-.06,.05,-.03,.045,-.05];
function collage(g,t,S){
  const {W,H,u,cy,lw,lh}=S,step=Math.floor(t*10),ts=step/10;
  g.drawImage(kraft(S),(hash(step,70)-.5)*2*u,(hash(step,71)-.5)*2*u);
  for(let i=0;i<5;i++){const ti=.1+.12*i;if(ts<ti)continue;const a=eo3(cl((ts-ti)/.3)),s=lerp(1.35,1,a),L=S.letters[i];
    const c=collageLetter(S,i),rot=CROT[i]+(hash(step,i)-.5)*.03,ox=(hash(step,i+9)-.5)*3*u,oy=(hash(step,i+19)-.5)*3*u;
    g.save();g.translate(S.lx+(L.x0+L.x1)/2+ox,cy+oy);g.rotate(rot);g.scale(s,s);
    g.shadowColor='rgba(40,20,0,.35)';g.shadowBlur=(8+30*(s-1))*u;g.shadowOffsetY=(5+40*(s-1))*u;g.drawImage(c,-c.width/2,-c.height/2);g.restore()}
  if(ts>=.9){const L=S.letters;tape(g,S.lx+L[0].x0+30*u,S.ly+10*u,120*u,38*u,-.6,u);tape(g,S.lx+L[4].x1-30*u,S.ly+12*u,120*u,38*u,.55,u);
    if(ts>=1.1)tape(g,S.lx+(L[2].x0+L[2].x1)/2,S.ly+lh-6*u,110*u,36*u,.1,u)}
}

/* ---------- 11 · glitch ---------- */
function scanlines(S){return cached(S,'scan',()=>{const c=mk(S.W,S.H),x=cx2(c);x.fillStyle='rgba(0,0,0,.28)';for(let y=0;y<S.H;y+=4*S.u)x.fillRect(0,y,S.W,1.6*S.u);return c})}
function glitch(g,t,S){
  const {W,H,u,cx,cy,lw,lh}=S,step=Math.floor(t*20),BG='#0B0B0D';
  g.fillStyle=BG;g.fillRect(0,0,W,H);
  let I=.12;if(t<.5)I=1-t/.5*.88;if((t>1.05&&t<1.2)||(t>1.7&&t<1.82))I=.85;if(t>2.1)I=.12+cl((t-2.1)/.4)*.9;
  const L=scr(S,'gl',W,H),x=cx2(L),dx=(5+I*30*hash(step,1))*u;
  x.globalCompositeOperation='lighter';x.drawImage(tint(S,'#00E5FF'),S.lx-dx,S.ly+(hash(step,2)-.5)*I*14*u);x.drawImage(tint(S,'#FF1F5A'),S.lx+dx,S.ly);
  x.globalCompositeOperation='source-over';x.globalAlpha=.92;x.drawImage(tint(S,'#F4F1EC'),S.lx,S.ly);x.globalAlpha=1;
  const ap=t<.08?0:1;g.globalAlpha=ap;g.drawImage(L,0,0);
  const n=Math.floor(2+I*12);for(let i=0;i<n;i++){const y=S.ly-30*u+hash(step,10+i)*(lh+60*u),h=(4+hash(step,30+i)*40*I)*u,sh=(hash(step,50+i)-.5)*I*240*u;
    g.fillStyle=BG;g.fillRect(0,y,W,h);g.drawImage(L,0,y,W,h,sh,y,W,h)}
  if(I>.35){for(let i=0;i<8;i++){g.fillStyle=['#00E5FF','#FF1F5A','#F4F1EC'][i%3];g.globalAlpha=.75*ap;
    g.fillRect(hash(step,70+i)*W,cy+(hash(step,80+i)-.5)*lh*3,(10+hash(step,90+i)*120)*u,(3+hash(step,95+i)*14)*u)}}
  g.globalAlpha=1;g.drawImage(scanlines(S),0,0);
  const by=((t*.7)%1)*H*1.2-H*.1,bg=g.createLinearGradient(0,by,0,by+140*u);bg.addColorStop(0,'rgba(255,255,255,0)');bg.addColorStop(.5,'rgba(255,255,255,.06)');bg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=bg;g.fillRect(0,by,W,140*u);
  g.font=`700 ${22*u}px "Space Mono"`;g.fillStyle='#00E5FF';g.textAlign='left';g.textBaseline='top';g.globalAlpha=hash(step,99)>.15?.8:0;
  g.fillText('> render --style=glitch',80*u,cy-lh*1.6*S.tall);g.globalAlpha=1;
}

/* ---------- cierre ---------- */
function outro(g,t,S){
  const {W,H,u}=S;g.fillStyle='#E63915';g.fillRect(0,0,W,H);
  const e=eob(cl(t/.55)),s=lerp(.86,1,e);g.globalAlpha=cl(t/.2);atLogo(g,S,s,s,0,0,.5,()=>g.drawImage(tint(S,'#FFFFFF'),0,0));
  const a=cl((t-.45)/.4);g.globalAlpha=a;g.fillStyle='#FFFFFF';g.font=`500 ${30*u}px "DM Sans"`;g.textAlign='center';g.textBaseline='top';
  g.fillText('Pivot Agencia · Marketing Digital',S.cx,S.cy+S.lh/2+56*u+(1-eo3(a))*14*u);g.globalAlpha=1;
}

const STYLES=[
  ['Swiss style',swiss,'#1A1A1A'],['Kinetic type',kinetic,'#F5F0E8'],['Pop art',pop,'#1A1A1A'],['Flat 2D',flat,'#1A1A1A'],
  ['Clay 3D',clay,'#7A2A14'],['Glassmorphism',glass,'#FFFFFF'],['Y2K chrome',y2k,'#2E2157'],['Synthwave',synth,'#FFE6FF'],
  ['Risograph',riso,'#0078BF'],['Paper collage',collage,'#1A1A1A'],['Glitch',glitch,'#F4F1EC']];
const SEGS=[];{let s=0;SEGS.push({fn:intro,dur:INTRO,start:s,left:'00  ORIGINAL',right:'/11',ticks:0,lc:'#1A1A1A'});s+=INTRO;
  STYLES.forEach(([n,fn,lc],i)=>{SEGS.push({fn,dur:D,start:s,left:pad2(i+1)+'  '+n.toUpperCase(),right:'/11',ticks:i+1,lc});s+=D});
  SEGS.push({fn:outro,dur:OUTRO,start:s,left:'PIVOT AGENCIA',right:'11/11',ticks:11,lc:'#FFFFFF'});}
const TOTAL=SEGS[SEGS.length-1].start+OUTRO;

function drawSeg(g,seg,t,S){g.save();seg.fn(g,t,S);g.restore();g.save();label(g,S,seg.left,seg.right,seg.ticks,seg.lc);g.restore()}
function renderAt(time,g,S){
  time=((time%TOTAL)+TOTAL)%TOTAL;let i=SEGS.findIndex(s=>time<s.start+s.dur);if(i<0)i=SEGS.length-1;
  const seg=SEGS[i],t=time-seg.start;
  drawSeg(g,seg,t,S);
}

/* ---------- arranque ---------- */
const params=new URLSearchParams(location.search),RENDER=params.get('render');
const FMT={post:[1080,1350],story:[1080,1920]};
async function boot(){
  LOGO=new Image();LOGO.src=LOGO_SRC;await LOGO.decode();
  await Promise.all(['700 26px "Space Mono"','700 26px "DM Sans"','500 26px "DM Sans"','400 26px "DM Sans"'].map(f=>document.fonts.load(f)));
  if(RENDER){
    document.body.classList.add('render');const [W,H]=FMT[RENDER]||FMT.post,c=document.getElementById('out');c.width=W;c.height=H;
    const S=makeS(W,H,RENDER),g=cx2(c);
    window.FRAMES=Math.round(TOTAL*FPS);
    window.frameAt=(k,type='image/png')=>{g.clearRect(0,0,W,H);renderAt(k/FPS,g,S);return c.toDataURL(type,.95)};
    window.ready=true;return;
  }
  const c=document.getElementById('c'),g=cx2(c);let fmt='post',S=null,playing=true,t0=performance.now(),tp=0;
  const setFmt=f=>{fmt=f;const [W,H]=FMT[f];c.width=W/2;c.height=H/2;S=makeS(W/2,H/2,f);
    document.getElementById('bPost').setAttribute('aria-pressed',f==='post');document.getElementById('bStory').setAttribute('aria-pressed',f==='story')};
  setFmt('post');
  document.getElementById('bPost').onclick=()=>setFmt('post');document.getElementById('bStory').onclick=()=>setFmt('story');
  const bp=document.getElementById('bPlay');
  const now=()=>playing?(performance.now()-t0)/1000:tp;
  bp.onclick=()=>{if(playing){tp=now();playing=false;bp.textContent='Reproducir'}else{t0=performance.now()-tp*1000;playing=true;bp.textContent='Pausar'}};
  const chips=document.getElementById('chips');
  SEGS.forEach((s,i)=>{const b=document.createElement('button');b.textContent=i===0?'Original':i===SEGS.length-1?'Cierre':STYLES[i-1][0];
    b.onclick=()=>{const tt=s.start+.01;if(playing)t0=performance.now()-tt*1000;else tp=tt};chips.appendChild(b)});
  const loop=()=>{renderAt(now(),g,S);requestAnimationFrame(loop)};loop();
}
boot();
